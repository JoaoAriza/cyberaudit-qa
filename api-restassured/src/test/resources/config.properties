base.uri=http://localhost:8081
# Banco do ambiente de teste (porta publicada do Postgres do docker-compose.test.yml).
# Usado SO pelo helper TestConfig.resetarContaParaFree, que reseta contas de pagamento
# para FREE antes dos testes de upgrade (idempotencia). So de teste (Regra 4).
db.url=jdbc:postgresql://localhost:5433/cyberaudit_qa
db.user=cyberaudit_qa
db.password=cyberaudit_qa_test_only
# SSRF-06: backend GEMEO sem o profile qa-docker (servico backend-noallowlist no
# docker-compose.test.yml). A allowlist nao existe fora do profile, entao ate
# juice-shop/wiremock caem em 403 DOMAIN_BLOCKED aqui.
base.uri.noAllowlist=http://localhost:8099
password=Teste@123
emailFree= qa-free@cyberaudit.test
emailPro=qa-pro@cyberaudit.test
emailEnterprise=qa-enterprise@cyberaudit.test
cpf=111.444.777-35

# AUTH-03: segredo HS256 do ambiente de teste (o mesmo de env/docker-compose.test.yml,
# JWT_SECRET). So de teste, nunca de producao (Regra 4). O teste forja tokens com ele.
jwt.secret=qa-docker-jwt-secret-32-bytes-minimo-fixo-e-conhecido
# userId do qa-pro no seed (env/seed.sql) — para o claim userId do token forjado.
userIdPro=b0000000-0000-0000-0000-000000000090
# userId do qa-enterprise no seed. AUTHZ-01 forja os dois: enterprise e' o "usuario B"
# (staff, cria scan passivo sem travar em posse) e qa-pro e' o "usuario A" (negado).
userIdEnterprise=b0000000-0000-0000-0000-00000000e9e9
# userId do qa-free no seed. PLAN-01 (Free pedindo PDF -> 402) e PLAN-02 (estourar
# a cota de 10 scans/dia do FREE -> 402) forjam o token do qa-free.
userIdFree=b0000000-0000-0000-0000-00000000f1ee

# DOM-01: alvo de scan ativo NAO verificado para a conta do qa-pro. juice-shop:3000
# e' verificado so para a conta enterprise (env/seed.sql), entao com o qa-pro ele cai
# em 403 ACCOUNT_DOMAIN_NOT_VERIFIED — prova que a checagem de posse e' por conta.
# Alvo local (Regra 2); a recusa acontece ANTES de qualquer scan rodar.
scanHostNaoVerificado=http://juice-shop:3000

# SSRF-04: hostnames "publicos" que resolvem para IP interno/privado via extra_hosts
# do backend (docker-compose.test.yml) — sem depender de DNS externo (nip.io). O guard
# resolve, ve IP interno e devolve 403 DOMAIN_BLOCKED.
ssrfHostResolvePrivado=http://interno-privado.cyberaudit.test
ssrfHostResolveLoopback=http://interno-loopback.cyberaudit.test
ssrfHostResolveMetadata=http://interno-metadata.cyberaudit.test

# SSRF-05: alvo que redireciona (302) para IP interno. redirect-mock e' um alias de
# rede do WireMock (allowlistado), entao a entrada passa e o scan segue o redirect ->
# o hop para 169.254.169.254 e' bloqueado (headers.error). Host distinto de "wiremock"
# -> chave de cache de scan diferente, sem colisao com o AUTHZ-01.
ssrfHostRedirect=http://redirect-mock:8080/redirect-interno

# PAY-*: contas FREE dedicadas aos testes de checkout que MUTAM estado (upgrade de
# plano / subscription). Cada teste usa a sua, pra não colidir com o qa-free nem entre
# si. Semeadas em env/seed.sql.
emailPayCard=qa-pay-card@cyberaudit.test
userIdPayCard=b0000000-0000-0000-0000-00000000ca01
emailPayNoCpf=qa-pay-nocpf@cyberaudit.test
userIdPayNoCpf=b0000000-0000-0000-0000-00000000ca14
emailPayPix=qa-pay-pix@cyberaudit.test
userIdPayPix=b0000000-0000-0000-0000-00000000b104
emailPayWebhook=qa-pay-webhook@cyberaudit.test
userIdPayWebhook=b0000000-0000-0000-0000-00000000eb06
# Secret do webhook do MP (o mesmo de env/docker-compose.test.yml, MP_WEBHOOK_SECRET).
# PAY-08 manda assinatura invalida → 401; PAY-06 computa o HMAC valido com ele.
mpWebhookSecret=qa-mp-webhook-secret-de-teste
# PAY-15: conta com Pix AUTHORIZED (antigo) + PENDING (novo) semeados (env/seed.sql).
# Read-only: GET /billing/subscription deve devolver o AUTHORIZED. Nao muta estado.
emailPay15=qa-pay-15@cyberaudit.test
userIdPay15=b0000000-0000-0000-0000-000000000015
# PAY-09: conta dedicada ao rate limit de checkout (5/min por usuario). Isola a bucket.
emailPay09=qa-pay-09@cyberaudit.test
userIdPay09=b0000000-0000-0000-0000-000000000009
# PAY-07: conta com Pix AUTHORIZED ativa (mp_payment_id 'pay07-sub', stub devolve
# rejected). Webhook rejected nesse payment deve ser no-op → continua AUTHORIZED.
emailPay07=qa-pay-07@cyberaudit.test
userIdPay07=b0000000-0000-0000-0000-000000000007
pay07PaymentId=pay07-sub
# PAY-10: conta para o job de expiracao. prepararPixVencida monta uma Pix AUTHORIZED
# vencida; /admin/test/expire-pix (so no profile qa-docker) dispara o job.
emailPay10=qa-pay-10@cyberaudit.test
userIdPay10=b0000000-0000-0000-0000-000000000010


