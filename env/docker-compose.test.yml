# Ambiente de teste do cyberaudit-qa — Fase 1 do plano de teste.
#
# `docker compose -f env/docker-compose.test.yml up --build` sobe os cinco
# serviços do escopo (backend, frontend, PostgreSQL, Juice Shop, WireMock) mais
# um seeder que roda uma vez e sai. Espera o `seeder` terminar (exit 0) antes de
# considerar o ambiente pronto — ele só roda depois que o backend responde
# saudável, porque precisa que o Hibernate já tenha criado o schema
# (ddl-auto=update, não existe migração separada neste projeto).
#
# Pressupõe Backend/ e Frontend/ como pastas irmãs de cyberaudit-qa/ (mesmo nível
# em C:\Projetos\Cyberaudit\) — é assim que os três repos vivem localmente hoje.
# Para CI (Fase 6), checkout dos três repos lado a lado antes deste comando.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cyberaudit_qa
      POSTGRES_USER: cyberaudit_qa
      POSTGRES_PASSWORD: cyberaudit_qa_test_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberaudit_qa -d cyberaudit_qa"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../../Backend
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/cyberaudit_qa
      DB_USERNAME: cyberaudit_qa
      DB_PASSWORD: cyberaudit_qa_test_only
      # 32+ bytes fixos, só para este ambiente — nunca usar em produção.
      JWT_SECRET: qa-docker-jwt-secret-32-bytes-minimo-fixo-e-conhecido
      DOMAIN_VERIFICATION_SECRET: qa-docker-domain-verification-secret-fixo
      # Origem do Frontend visto PELO NAVEGADOR (Cypress/Selenium rodam no host,
      # não dentro da rede do Docker) — precisa bater com a porta publicada abaixo.
      ALLOWED_ORIGINS: http://localhost:8090
      TRUSTED_PROXY_COUNT: "0"
      MAIL_ENABLED: "false"
      # Só qa-enterprise pula a exigência de posse de domínio no scan ativo
      # (PlatformStaffService — primeira checagem de PlanLimitService.enforceScanLimits,
      # antes até do bloqueio de plano FREE). Sem isto, mesmo com o domínio marcado
      # "verified" na tabela, o scan ativo ainda faz uma checagem AO VIVO de
      # /.well-known/cyberaudit.txt no alvo — e terceiros como o Juice Shop não têm
      # como servir esse arquivo. qa-pro fica de fora DE PROPÓSITO (revisado em
      # 2026-10-01): é a conta do caso DOM-01 (PRO de verdade, domínio NÃO
      # verificado, scan ativo recusado) — com bypass ou com o domínio marcado
      # verified no seed, esse cenário nunca seria alcançável. qa-free também
      # fica de fora, mas por outro motivo: plano FREE já bloqueia scan ativo
      # antes de chegar na checagem de domínio (PLAN-01), nem testa o DOM-01.
      PLATFORM_STAFF_EMAILS: qa-enterprise@cyberaudit.test
      # Pagamentos (PAY-*): o MP é MOCKADO no WireMock. MP_BASE_URL aponta o backend
      # pro WireMock (requer o patch do BASE configurável no Backend), MP_ACCESS_TOKEN
      # é um valor dummy só pra isConfigured()=true (nunca um token real), e
      # MP_WEBHOOK_SECRET habilita a validação de assinatura do webhook (PAY-06/08).
      MP_ACCESS_TOKEN: "TEST-mock-nao-real"
      MP_BASE_URL: "http://wiremock:8080"
      MP_WEBHOOK_SECRET: "qa-mp-webhook-secret-de-teste"
      NVD_API_KEY: ""
      SCAN_MAX_CONCURRENT: "4"
      SCAN_ACQUIRE_TIMEOUT: "20"
      DNS_CACHE_TTL_SECONDS: "30"
      # A allowlist que existe SÓ neste profile — ver SsrfTestAllowlistConfig e o
      # caso SSRF-06, que prova que ela não existe fora dele.
      SPRING_PROFILES_ACTIVE: qa-docker
      # redirect-mock é um network alias do WireMock (mesmo container) — allowlistado
      # para o SSRF-05: a URL de ENTRADA passa (host confiável), mas o alvo do redirect
      # (169.254.169.254) continua bloqueado no hop. Host distinto de "wiremock" → chave
      # de cache de scan diferente → sem colisão com o AUTHZ-01 (que escaneia wiremock).
      SSRF_TEST_ALLOWLIST: juice-shop,wiremock,redirect-mock
    # SSRF-04: nomes "públicos" que resolvem para IP interno/privado via /etc/hosts
    # do container — sem depender de DNS externo (nip.io) numa CI isolada. Nenhum
    # deles está na SSRF_TEST_ALLOWLIST, então o guard resolve → vê IP interno →
    # 403 DOMAIN_BLOCKED. (extra_hosts só vale ao RECRIAR o container.)
    extra_hosts:
      - "interno-privado.cyberaudit.test:10.0.0.1"
      - "interno-loopback.cyberaudit.test:127.0.0.1"
      - "interno-metadata.cyberaudit.test:169.254.169.254"
    ports:
      # Publicado pra Cypress/Selenium/RestAssured no host baterem direto na API.
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # Backend GÊMEO do caso SSRF-06. É o MESMO build e os MESMOS envs do `backend`,
  # com UMA diferença deliberada: NÃO define SPRING_PROFILES_ACTIVE=qa-docker.
  #
  # Por que isto prova o SSRF-06: a allowlist anti-SSRF é instalada por um único
  # bean, SsrfTestAllowlistConfig, anotado @Profile("qa-docker") — é o ÚNICO bean
  # com esse profile em todo o Backend. Fora do profile o Spring nem instancia a
  # classe, então SsrfGuard.testAllowlist nunca sai de Set.of(). Repare que
  # SSRF_TEST_ALLOWLIST continua setado abaixo DE PROPÓSITO: o ponto do caso é que
  # a variável é lida mas fica inerte sem o profile — nenhum bean a consome. Com
  # isso, mesmo `juice-shop`/`wiremock` (que aqui resolvem para IP privado do
  # Docker) caem em 403 DOMAIN_BLOCKED, igual a qualquer alvo interno.
  #
  # Compartilha o mesmo Postgres do `backend` (schema já criado por ele) e só sobe
  # depois dele ficar saudável, pra não haver corrida de ddl-auto=update no schema.
  # Publicado em 8099 para o RestAssured bater direto (ver base.uri.noAllowlist no
  # config.properties). Em produção este serviço não existe — é só do ambiente de teste.
  backend-noallowlist:
    build:
      context: ../../Backend
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/cyberaudit_qa
      DB_USERNAME: cyberaudit_qa
      DB_PASSWORD: cyberaudit_qa_test_only
      JWT_SECRET: qa-docker-jwt-secret-32-bytes-minimo-fixo-e-conhecido
      DOMAIN_VERIFICATION_SECRET: qa-docker-domain-verification-secret-fixo
      ALLOWED_ORIGINS: http://localhost:8090
      TRUSTED_PROXY_COUNT: "0"
      MAIL_ENABLED: "false"
      PLATFORM_STAFF_EMAILS: qa-enterprise@cyberaudit.test
      MP_ACCESS_TOKEN: ""
      NVD_API_KEY: ""
      SCAN_MAX_CONCURRENT: "4"
      SCAN_ACQUIRE_TIMEOUT: "20"
      DNS_CACHE_TTL_SECONDS: "30"
      # Sem SPRING_PROFILES_ACTIVE: este é o inteiro propósito do serviço.
      # A linha abaixo fica setada para provar que, fora do profile, ela é inerte.
      SSRF_TEST_ALLOWLIST: juice-shop,wiremock
    ports:
      - "127.0.0.1:8099:8081"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ../../Frontend
      args:
        # URL que o JAVASCRIPT DO NAVEGADOR usa — o navegador roda no host, fora
        # da rede do Docker, então tem que ser a porta publicada do backend
        # acima, nunca o nome do serviço "backend".
        VITE_API_URL: http://localhost:8081
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      backend:
        condition: service_healthy

  juice-shop:
    image: bkimminich/juice-shop
    ports:
      - "127.0.0.1:3001:3000"

  wiremock:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating"]
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/__files:/home/wiremock/__files
    # Alias extra na rede: o mesmo container responde também como "redirect-mock".
    # Usado pelo SSRF-05 (host allowlistado, mas com chave de cache distinta de
    # "wiremock" — evita colidir com o scan de wiremock do AUTHZ-01).
    networks:
      default:
        aliases:
          - redirect-mock

  # Roda uma vez (popula os usuários de seed) e sai — não faz parte do "up"
  # de longa duração. `docker compose ... up seeder` ou aguardar o exit 0 no
  # log confirma que terminou.
  seeder:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: cyberaudit_qa_test_only
    volumes:
      - ./seed.sql:/seed.sql:ro
    entrypoint:
      ["psql", "-h", "postgres", "-U", "cyberaudit_qa", "-d", "cyberaudit_qa", "-f", "/seed.sql"]
    depends_on:
      backend:
        condition: service_healthy
